{{define "content"}}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <form class="card" method="post" action="/parents/{{.D.ID}}">
      <div class="card-body">
        {{template "parent-fields" (dict "Admin" .D "New" false)}}
      </div>
      <div class="card-footer d-flex">
        <a href="/parents" class="btn btn-link">Cancel</a>
        <button class="btn btn-primary ms-auto">Save</button>
      </div>
    </form>
    {{if ne .D.ID .User.ID}}
    <form method="post" action="/parents/{{.D.ID}}/delete" class="mt-3" data-confirm="Remove {{.D.Name}}'s account?">
      <button class="btn btn-ghost-danger"><i class="ti ti-trash me-1"></i>Remove {{.D.Name}}</button>
    </form>
    {{end}}
  </div>
</div>
{{end}}
