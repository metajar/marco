services:
  marco:
    build: .
    container_name: marco
    restart: unless-stopped
    # Host networking is required: marco has to see the LAN and its ARP table.
    network_mode: host
    cap_add:
      - NET_ADMIN # refresh ARP entries so sleeping phones are detected accurately
      - NET_RAW   # ICMP ping
    environment:
      - TZ=America/Denver # change to your timezone
      - MARCO_ADDR=:9876
    volumes:
      - ./data:/data
